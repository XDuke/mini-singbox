name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: test "$(go env GOVERSION)" = go1.26.6
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet -tags with_utls ./...
      - run: go test -tags with_utls ./...
      - run: go test -race -tags with_utls ./...
      - run: go test -tags fuzz -run '^$' -fuzz=FuzzDecode -fuzztime=5s ./internal/config
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          set +e
          "$(go env GOPATH)/bin/govulncheck" -tags with_utls ./... 2>&1 | tee govulncheck.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "GOVULNCHECK_STATUS=$status" >> "$GITHUB_ENV"
      - name: Static linux builds
        run: |
          version="candidate-${GITHUB_SHA:0:12}"
          build_time="$(git show -s --format=%cI HEAD)"
          ldflags="-s -w -buildid= -X github.com/XDuke/mini-singbox/internal/version.Version=$version -X github.com/XDuke/mini-singbox/internal/version.Commit=$GITHUB_SHA -X github.com/XDuke/mini-singbox/internal/version.BuildTime=$build_time -X github.com/XDuke/mini-singbox/internal/version.Dirty=false"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_utls -trimpath -ldflags="$ldflags" -o mini-singbox-linux-amd64 ./cmd/mini-singbox
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags with_utls -trimpath -ldflags="$ldflags" -o mini-singbox-linux-arm64 ./cmd/mini-singbox
          file mini-singbox-linux-amd64 | grep -q 'statically linked'
          file mini-singbox-linux-arm64 | grep -q 'statically linked'
          ./mini-singbox-linux-amd64 version | grep -Fx "mini-singbox $version"
          ./mini-singbox-linux-amd64 version | grep -Fx "git_commit $GITHUB_SHA"
          go version -m mini-singbox-linux-amd64
          go version -m mini-singbox-linux-arm64
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'version=%s\n' "$version"
            printf 'amd64_sha256=%s\n' "$(sha256sum mini-singbox-linux-amd64 | awk '{ print $1 }')"
            printf 'arm64_sha256=%s\n' "$(sha256sum mini-singbox-linux-arm64 | awk '{ print $1 }')"
          } > candidate-binary-identity.txt
      - name: Unprivileged deployer binary traversal
        run: |
          test_directory="$(mktemp -d)"
          trap 'rm -rf "$test_directory"' EXIT
          chmod 0711 "$test_directory"
          install -m 0755 mini-singbox-linux-amd64 "$test_directory/mini-singbox"
          sudo -u nobody -- "$test_directory/mini-singbox" version | grep -Fx "git_commit $GITHUB_SHA"
      - name: On-demand control tool and IPv6 delivery
        run: tests/control-tool.sh scripts/mini-singboxctl ./mini-singbox-linux-amd64
      - name: Compiled dependency audit
        run: |
          GOOS=linux GOARCH=amd64 go list -tags with_utls -deps ./cmd/mini-singbox | sort -u > compiled-deps-linux-amd64.txt
          if grep -E 'github.com/sagernet/gvisor|sing-box/protocol/tun|sing-box/transport/wireguard|sing-box/endpoint/wireguard' compiled-deps-linux-amd64.txt; then
            exit 1
          fi
          grep -E '^github.com/sagernet/(sing-tun|nftables)(/|$)' compiled-deps-linux-amd64.txt > upstream-compiled-network-utilities.txt || true
      - name: Binary forbidden-string scan
        run: |
          if strings mini-singbox-linux-amd64 | grep -E 'panel-token|panel-url|users\.json|/stats|/health'; then
            exit 1
          fi
      - name: Source forbidden-implementation scan
        run: |
          if grep -RniE 'Xboard|panelapi|UserManager|TrafficCounter|Snapshot|serveStats|ServeSubscription|SubscriptionOptions|serve-subscription|subscription-port|/stats|/health|panel-token|panel-url|users\.json' cmd internal packaging; then
            exit 1
          fi
      - name: Project identity and stale-name guard
        run: |
          test "$(head -n 1 go.mod)" = 'module github.com/XDuke/mini-singbox'
          test -z "$(git grep -nI -e 'mini-sb-local' -e 'mini-sb-agent' -e 'ashvvvvv' -e 'MINI_SB_' -- . ':(exclude).github/workflows/ci.yml' ':(exclude).github/workflows/release.yml' || true)"
      - name: Shell syntax
        run: |
          bash -n bootstrap.sh tests/bootstrap.sh
          sh -n scripts/uninstall.sh scripts/deploy.sh scripts/mini-singboxctl scripts/mini-singbox-containerctl \
            packaging/openrc/mini-singbox packaging/external/mini-singbox-run \
            tests/no-egress.sh tests/cgroup-observe.sh tests/restart-cycle.sh tests/control-tool.sh \
            tests/fake-release-curl.sh tests/alpine-runtime.sh
      - name: Shell static analysis
        run: |
          shellcheck --shell bash bootstrap.sh tests/bootstrap.sh
          shellcheck --shell sh scripts/uninstall.sh scripts/deploy.sh scripts/mini-singboxctl scripts/mini-singbox-containerctl \
            packaging/openrc/mini-singbox packaging/external/mini-singbox-run \
            tests/control-tool.sh tests/no-egress.sh tests/fake-release-curl.sh tests/alpine-runtime.sh
      - name: Stable bootstrap guardrails
        run: tests/bootstrap.sh
      - name: On-demand control-plane guardrails
        run: |
          test -z "$(grep -nE 'curl|wget|https?://' scripts/mini-singboxctl || true)"
          test -z "$(grep -RniF 'mini-singboxctl' packaging || true)"
          grep -Fq 'qr [reality|hy2|anytls|all]' scripts/mini-singboxctl
      - name: Systemd profile guardrails
        run: |
          grep -Fx 'PrivateTmp=true' packaging/systemd/mini-singbox.service
          grep -Fx 'ProtectSystem=strict' packaging/systemd/mini-singbox.service
          test -z "$(grep -E '^(Private|Protect|RestrictAddressFamilies|LockPersonality|MemoryDenyWriteExecute|RestrictRealtime|RestrictSUIDSGID|SystemCallArchitectures)' packaging/systemd/mini-singbox-container.service || true)"
          for setting in \
            'User=mini-singbox' \
            'Group=mini-singbox' \
            'NoNewPrivileges=true' \
            'CapabilityBoundingSet=' \
            'AmbientCapabilities=' \
            'MemoryMax=128M' \
            'TasksMax=64'; do
            grep -Fx "$setting" packaging/systemd/mini-singbox-container.service
          done
      - name: OpenRC and external runtime guardrails
        run: |
          grep -Fx 'command_user="mini-singbox:mini-singbox"' packaging/openrc/mini-singbox
          grep -Fx 'supervisor="supervise-daemon"' packaging/openrc/mini-singbox
          grep -Fx 'pidfile="/run/mini-singbox.pid"' packaging/openrc/mini-singbox
          grep -Fx 'no_new_privs=yes' packaging/openrc/mini-singbox
          test -z "$(grep -F 'owner mini-singbox' packaging/openrc/mini-singbox || true)"
          grep -Fq 'exec runuser -u "$SERVICE_USER"' packaging/external/mini-singbox-run
          grep -Fq 'tune apply is disabled for external/container runtime' scripts/mini-singboxctl
          grep -Fq 'tune apply is disabled inside' internal/tune/manager.go
          test -z "$(grep -F '/var/run/docker.sock' scripts/mini-singbox-containerctl || true)"
          grep -Fq 'the selected Podman engine is not rootless' scripts/mini-singbox-containerctl
          grep -Fq 'the selected Docker engine is not rootless' scripts/mini-singbox-containerctl
          grep -Fq 'libqrencode-tools' scripts/deploy.sh
          grep -Fq 'find_supports_printf' scripts/deploy.sh
          grep -Fq 'ps_supports_pid_filter' scripts/deploy.sh
          grep -Fq 'image_reference_is_id' scripts/mini-singbox-containerctl
      - name: Compose syntax
        env:
          REALITY_SERVER_NAME: www.example.com
          REALITY_HANDSHAKE: www.example.com:443
          TLS_SAN: proxy.example.com
        run: docker compose config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: security-audit-inputs
          path: |
            compiled-deps-linux-amd64.txt
            upstream-compiled-network-utilities.txt
            govulncheck.txt
            mini-singbox-linux-amd64
            mini-singbox-linux-arm64
            candidate-binary-identity.txt
      - name: Enforce release security gates
        run: |
          test "$GOVULNCHECK_STATUS" = 0

  container:
    runs-on: ubuntu-24.04
    needs: test
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA} --build-arg DIRTY=false -t mini-singbox:ci .
      - name: Image metadata
        run: |
          test "$(docker image inspect mini-singbox:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect mini-singbox:ci --format '{{json .Config.Entrypoint}}')" = '["/mini-singbox"]'
      - name: Hardened version command
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 128m \
            mini-singbox:ci version
          if docker run --rm --entrypoint /bin/sh mini-singbox:ci -c true; then
            echo 'scratch image unexpectedly contains a shell' >&2
            exit 1
          fi
      - name: Network-disabled generation and check
        run: |
          mkdir generated
          sudo chown 65532:65532 generated
          sudo chmod 0700 generated
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 128m \
            -v "$PWD/generated:/output" mini-singbox:ci generate \
            --output /output --protocols reality,hy2,anytls --listen 127.0.0.1 \
            --public-address 203.0.113.10 \
            --reality-server-name www.example.com \
            --reality-handshake www.example.com:443 --tls-san proxy.example.com
          test "$(sudo stat -c '%a' generated/config.json)" = 600
          test "$(sudo stat -c '%a' generated/reality.key)" = 600
          test "$(sudo stat -c '%a' generated/tls.key)" = 600
          test "$(sudo stat -c '%a' generated/tls.crt)" = 644
          test "$(sudo stat -c '%a' generated/share-reality.txt)" = 600
          test "$(sudo stat -c '%a' generated/share-hysteria2.txt)" = 600
          test "$(sudo stat -c '%a' generated/client-anytls-sing-box-outbound.json)" = 600
          test ! -e generated/share-anytls.txt
          sudo jq -e '(.tls.certificate | type) == "array" and (.tls.certificate | length) == 1 and (.tls.certificate[0] | startswith("-----BEGIN CERTIFICATE-----"))' generated/client-anytls-sing-box-outbound.json
          test -z "$(sudo grep -F '"insecure"' generated/client-anytls-sing-box-outbound.json || true)"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 128m \
            -v "$PWD/generated:/etc/mini-singbox:ro" mini-singbox:ci \
            check -c /etc/mini-singbox/config.json
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 128m \
            -v "$PWD/generated:/etc/mini-singbox:ro" mini-singbox:ci \
            tune plan -c /etc/mini-singbox/config.json | grep -Fq 'Hysteria2      : enabled (UDP/QUIC, observe only)'
      - name: Unprivileged idle start and stop
        run: |
          container_id=$(docker run -d --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 128m \
            -e GOMAXPROCS=1 -e GOMEMLIMIT=48MiB -e GOGC=70 \
            -v "$PWD/generated:/etc/mini-singbox:ro" mini-singbox:ci)
          sleep 5
          test "$(docker inspect "$container_id" --format '{{.State.Running}}')" = true
          docker stop --time 10 "$container_id"
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = 0
          docker rm "$container_id"

  alpine:
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        alpine: ["3.23", "3.24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: security-audit-inputs
          path: artifacts
      - name: Alpine external-supervisor acceptance
        run: |
          chmod 0755 artifacts/mini-singbox-linux-amd64
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/artifacts:/artifacts:ro" \
            "alpine:${{ matrix.alpine }}" \
            /workspace/tests/alpine-runtime.sh external

  alpine-openrc:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: security-audit-inputs
          path: artifacts
      - name: Boot privileged Alpine OpenRC fixture
        run: |
          chmod 0755 artifacts/mini-singbox-linux-amd64
          docker run -d --privileged --name mini-singbox-openrc \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/artifacts:/artifacts:ro" \
            alpine:3.24 /bin/sh -c 'apk add --no-cache openrc && exec /sbin/init'
          for attempt in $(seq 1 30); do
            docker exec mini-singbox-openrc test -d /run/openrc && exit 0
            sleep 1
          done
          docker logs mini-singbox-openrc
          exit 1
      - name: Alpine OpenRC auto-detection acceptance
        run: docker exec mini-singbox-openrc /workspace/tests/alpine-runtime.sh openrc-auto
      - name: Inactive external to containerized OpenRC migration acceptance
        run: docker exec mini-singbox-openrc /workspace/tests/alpine-runtime.sh openrc-migration
      - name: OpenRC fixture logs
        if: always()
        run: |
          docker logs mini-singbox-openrc || true
          docker rm -f mini-singbox-openrc || true

  rootless-podman:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Install rootless Podman test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman jq
      - name: Build local OCI image
        run: docker build --build-arg VERSION=ci-podman --build-arg COMMIT=${GITHUB_SHA} --build-arg DIRTY=false -t mini-singbox:podman .
      - name: Import image into rootless Podman
        run: |
          docker save mini-singbox:podman | podman load
          podman image inspect docker.io/library/mini-singbox:podman >/dev/null
      - name: Rootless Podman lifecycle acceptance
        env:
          MINI_SINGBOX_CONTAINER_ENGINE: podman
          MINI_SINGBOX_CONTAINER_STATE_DIR: ${{ runner.temp }}/mini-singbox-podman
          MINI_SINGBOX_IMAGE: docker.io/library/mini-singbox:podman
          MINI_SINGBOX_PUBLIC_ADDRESS: 203.0.113.10
          MINI_SINGBOX_REALITY_SERVER_NAME: www.example.com
          MINI_SINGBOX_REALITY_HANDSHAKE: www.example.com:443
          MINI_SINGBOX_TLS_SAN: 203.0.113.10
          MINI_SINGBOX_REALITY_PORT: 32001
          MINI_SINGBOX_HY2_PORT: 32002
          MINI_SINGBOX_ANYTLS_PORT: 32003
        run: |
          scripts/mini-singbox-containerctl init
          scripts/mini-singbox-containerctl check
          scripts/mini-singbox-containerctl up
          scripts/mini-singbox-containerctl status
          test "$(podman inspect mini-singbox --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(podman inspect mini-singbox --format '{{.HostConfig.PidsLimit}}')" = 64
          test "$(podman inspect mini-singbox --format '{{.HostConfig.Memory}}')" = 134217728
          image_id="$(podman image inspect --format '{{.Id}}' docker.io/library/mini-singbox:podman)"
          scripts/mini-singbox-containerctl upgrade "$image_id"
          scripts/mini-singbox-containerctl rollback
          scripts/mini-singbox-containerctl down

  candidate:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop/v1.2.0-alpine'
    needs: [test, container, alpine, alpine-openrc, rootless-podman]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: security-audit-inputs
          path: dist
      - name: Validate immutable binary identity
        run: |
          set -eu
          short_commit="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          expected_version="candidate-$short_commit"
          chmod 0755 dist/mini-singbox-linux-amd64 dist/mini-singbox-linux-arm64
          file dist/mini-singbox-linux-amd64 | grep -q 'statically linked'
          file dist/mini-singbox-linux-arm64 | grep -q 'statically linked'
          file dist/mini-singbox-linux-amd64 | grep -q 'x86-64'
          file dist/mini-singbox-linux-arm64 | grep -q 'ARM aarch64'
          grep -Fx "source_commit=$GITHUB_SHA" dist/candidate-binary-identity.txt
          grep -Fx "version=$expected_version" dist/candidate-binary-identity.txt
          amd64_sha256="$(sha256sum dist/mini-singbox-linux-amd64 | awk '{ print $1 }')"
          arm64_sha256="$(sha256sum dist/mini-singbox-linux-arm64 | awk '{ print $1 }')"
          grep -Fx "amd64_sha256=$amd64_sha256" dist/candidate-binary-identity.txt
          grep -Fx "arm64_sha256=$arm64_sha256" dist/candidate-binary-identity.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Stage commit-specific deployment bundle
        run: |
          grep -Fq 'github.com/sagernet/sing-box v1.13.18' go.mod
          short_commit="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          release_tag="candidate-$short_commit"
          cat > dist/release-metadata.txt <<EOF
          version=$release_tag
          commit=$GITHUB_SHA
          go_version=1.26.6
          sing_box_version=v1.13.18
          channel=candidate
          EOF
          cp bootstrap.sh dist/bootstrap.sh
          cp scripts/deploy.sh dist/deploy.sh
          cp scripts/mini-singboxctl dist/mini-singboxctl
          cp scripts/mini-singbox-containerctl dist/mini-singbox-containerctl
          cp scripts/uninstall.sh dist/uninstall.sh
          cp packaging/systemd/mini-singbox.service dist/mini-singbox.service
          cp packaging/systemd/mini-singbox-container.service dist/mini-singbox-container.service
          cp packaging/openrc/mini-singbox dist/mini-singbox
          cp packaging/external/mini-singbox-run dist/mini-singbox-run
          cp release/minisign.pub dist/minisign.pub
          chmod 0755 dist/bootstrap.sh dist/deploy.sh dist/mini-singboxctl \
            dist/mini-singbox-containerctl dist/uninstall.sh dist/mini-singbox dist/mini-singbox-run
      - name: Attest candidate binaries
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/mini-singbox-linux-amd64
            dist/mini-singbox-linux-arm64
      - name: Assemble checksum manifest
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort | xargs sha256sum) > dist/SHA256SUMS
      - name: Publish commit-specific prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_commit="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          release_tag="candidate-$short_commit"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; refusing to replace immutable assets"
            exit 0
          fi
          gh release create "$release_tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "mini-singbox candidate $short_commit" \
            --notes "Commit-specific CI candidate for Alpine and low-memory validation. This is not a stable signed release."
      - name: Public minimal-Alpine bootstrap smoke test
        run: |
          short_commit="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          release_tag="candidate-$short_commit"
          docker run --rm \
            -e MINI_SINGBOX_ALLOW_CANDIDATE=1 \
            -e MINI_SINGBOX_VERSION="$release_tag" \
            -e MINI_SINGBOX_RUNTIME=external \
            -e MINI_SINGBOX_AUTO_DETECT=0 \
            -e MINI_SINGBOX_AUTO_TUNE=0 \
            -e MINI_SINGBOX_PUBLIC_ADDRESS=203.0.113.10 \
            -e MINI_SINGBOX_REALITY_SERVER_NAME=www.example.com \
            -e MINI_SINGBOX_REALITY_HANDSHAKE=www.example.com:443 \
            -e MINI_SINGBOX_TLS_SAN=203.0.113.10 \
            -e EXPECTED_COMMIT="$GITHUB_SHA" \
            -e BOOTSTRAP_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/bootstrap.sh" \
            alpine:3.24 /bin/sh -c '
              set -eu
              if command -v curl >/dev/null 2>&1; then
                echo "minimal Alpine fixture unexpectedly contains curl" >&2
                exit 1
              fi
              sh -c "set -o pipefail; wget -qO- \"$BOOTSTRAP_URL\" | sh"
              /usr/local/bin/mini-singbox version | grep -Fx "mini-singbox $MINI_SINGBOX_VERSION"
              /usr/local/bin/mini-singbox version | grep -Fx "git_commit $EXPECTED_COMMIT"
              /usr/local/bin/mini-singbox check -c /etc/mini-singbox/config.json
              grep -Fx "source_commit=$EXPECTED_COMMIT" /etc/mini-singbox/deployment-info.txt
              grep -Fx "runtime=external" /etc/mini-singbox/deployment-info.txt
              test -x /usr/local/bin/mini-singbox-run
            '
