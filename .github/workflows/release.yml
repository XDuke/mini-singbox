name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable annotated tag to release"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Validate exact tag
        id: tag
        run: |
          set -eu
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          original_tag_ref="refs/mini-singbox-release/tags/$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$original_tag_ref"
          test "$(git cat-file -t "$original_tag_ref")" = tag
          release_commit="$(git rev-parse "$original_tag_ref^{}")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          remote_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{ print $1 }')"
          test -n "$remote_commit"
          test "$remote_commit" = "$release_commit"
          test -z "$(git status --porcelain)"
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: test "$(go env GOVERSION)" = go1.26.6
      - run: test -z "$(gofmt -l .)"
      - name: Stable bootstrap guardrails
        run: |
          bash -n bootstrap.sh tests/bootstrap.sh
          shellcheck --shell bash bootstrap.sh tests/bootstrap.sh
          tests/bootstrap.sh
      - run: go mod verify
      - run: go vet -tags with_utls ./...
      - run: go test -tags with_utls ./...
      - run: go test -race -tags with_utls ./...
      - run: go test -tags fuzz -run '^$' -fuzz=FuzzDecode -fuzztime=30s ./internal/config
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" -tags with_utls ./...
      - name: Build release binaries
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -eu
          mkdir dist
          build_dir="$RUNNER_TEMP/mini-singbox-release-build"
          mkdir -p "$build_dir"
          build_time="$(git show -s --format=%cI HEAD)"
          ldflags="-s -w -buildid= -X github.com/XDuke/mini-singbox/internal/version.Version=$VERSION -X github.com/XDuke/mini-singbox/internal/version.Commit=$COMMIT -X github.com/XDuke/mini-singbox/internal/version.BuildTime=$build_time -X github.com/XDuke/mini-singbox/internal/version.Dirty=false"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_utls -trimpath -ldflags="$ldflags" -o "$build_dir/mini-singbox-linux-amd64" ./cmd/mini-singbox
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags with_utls -trimpath -ldflags="$ldflags" -o "$build_dir/mini-singbox-linux-arm64" ./cmd/mini-singbox
          mv "$build_dir/mini-singbox-linux-amd64" "$build_dir/mini-singbox-linux-arm64" dist/
          file dist/mini-singbox-linux-amd64 | grep -q 'statically linked'
          file dist/mini-singbox-linux-arm64 | grep -q 'statically linked'
          ! ldd dist/mini-singbox-linux-amd64 2>&1 | grep -q '=>'
          dist/mini-singbox-linux-amd64 version | grep -Fx "mini-singbox $VERSION"
          dist/mini-singbox-linux-amd64 version | grep -Fx "git_commit $COMMIT"
          dist/mini-singbox-linux-amd64 version | grep -Fx 'target linux/amd64'
          dist/mini-singbox-linux-amd64 version | grep -Fx 'dirty_build false'
          go version -m dist/mini-singbox-linux-amd64 | tee dist/go-version-amd64.txt
          go version -m dist/mini-singbox-linux-arm64 | tee dist/go-version-arm64.txt
          grep -F 'vcs.modified=false' dist/go-version-amd64.txt
          grep -F 'vcs.modified=false' dist/go-version-arm64.txt
          ! grep -F '+dirty' dist/go-version-amd64.txt
          ! grep -F '+dirty' dist/go-version-arm64.txt
          go tool nm dist/mini-singbox-linux-amd64 > dist/nm-amd64.txt 2>&1 || grep -q 'no symbols' dist/nm-amd64.txt
      - name: Compiled dependency and forbidden-content audit
        run: |
          GOOS=linux GOARCH=amd64 go list -tags with_utls -deps ./cmd/mini-singbox | sort -u > dist/compiled-deps-linux-amd64.txt
          if grep -E 'github.com/sagernet/gvisor|sing-box/protocol/tun|sing-box/transport/wireguard|sing-box/endpoint/wireguard' dist/compiled-deps-linux-amd64.txt; then exit 1; fi
          grep -E '^github.com/sagernet/(sing-tun|nftables)(/|$)' dist/compiled-deps-linux-amd64.txt > dist/upstream-compiled-network-utilities.txt || true
          if strings dist/mini-singbox-linux-amd64 | grep -E 'panel-token|panel-url|users\.json|/stats|/health'; then exit 1; fi
          test -z "$(git grep -nI -e 'mini-sb-local' -e 'mini-sb-agent' -e 'ashvvvvv' -e 'MINI_SB_' -- . ':(exclude).github/workflows/ci.yml' ':(exclude).github/workflows/release.yml' || true)"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          file: dist/mini-singbox-linux-amd64
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/mini-singbox-linux-amd64
            dist/mini-singbox-linux-arm64
      - name: Preserve provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl
      - name: Prepare release metadata and OCI tags
        id: oci-meta
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -eu
          grep -Fq 'github.com/sagernet/sing-box v1.13.18' go.mod
          build_time="$(git show -s --format=%cI HEAD)"
          {
            printf 'version=%s\n' "$RELEASE_TAG"
            printf 'commit=%s\n' "$RELEASE_COMMIT"
            printf 'go_version=1.26.6\n'
            printf 'sing_box_version=v1.13.18\n'
            case "$RELEASE_TAG" in *-*) printf 'channel=prerelease\n' ;; *) printf 'channel=stable\n' ;; esac
          } > dist/release-metadata.txt
          image=ghcr.io/xduke/mini-singbox
          tags="$image:$RELEASE_TAG"
          case "$RELEASE_TAG" in
            *-*) ;;
            *)
              major_minor="$(printf '%s' "$RELEASE_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')"
              tags="$tags,$image:$major_minor,$image:latest"
              ;;
          esac
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse replacement of an existing immutable OCI version tag
        run: |
          if docker buildx imagetools inspect '${{ steps.oci-meta.outputs.image }}:${{ env.RELEASE_TAG }}' >/dev/null 2>&1; then
            echo 'immutable OCI version tag already exists' >&2
            exit 1
          fi
      - name: Build and publish multi-architecture OCI image
        id: oci
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.oci-meta.outputs.tags }}
          provenance: false
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            COMMIT=${{ steps.tag.outputs.commit }}
            BUILD_TIME=${{ steps.oci-meta.outputs.build_time }}
            DIRTY=false
      - name: Attest OCI image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.oci-meta.outputs.image }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true
      - name: Record immutable OCI identity
        run: |
          printf '%s@%s\n' '${{ steps.oci-meta.outputs.image }}' '${{ steps.oci.outputs.digest }}' > dist/oci-digests.txt
          docker buildx imagetools inspect '${{ steps.oci-meta.outputs.image }}@${{ steps.oci.outputs.digest }}'
      - name: Assemble and sign checksums
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          test -n "$MINISIGN_PRIVATE_KEY"
          test -n "$MINISIGN_PASSWORD"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 0600 "$RUNNER_TEMP/minisign.key"
          unset MINISIGN_PRIVATE_KEY
          release_files=(
            dist/mini-singbox-linux-amd64
            dist/mini-singbox-linux-arm64
            dist/SBOM.spdx.json
            dist/provenance.intoto.jsonl
            dist/go-version-amd64.txt
            dist/go-version-arm64.txt
            dist/compiled-deps-linux-amd64.txt
            dist/upstream-compiled-network-utilities.txt
            dist/release-metadata.txt
            dist/oci-digests.txt
            LICENSE
            NOTICE
            README.md
            bootstrap.sh
            CHANGELOG.md
            SECURITY.md
            MIGRATION.md
            docs/release.md
            docs/alpine-container.md
            docs/nat-vps.md
            docs/tcp-tuning.md
            docs/v1.0.0-readiness.md
            docs/validation.md
            examples/config.json
            release/minisign.pub
            scripts/deploy.sh
            scripts/uninstall.sh
            scripts/mini-singboxctl
            scripts/mini-singbox-containerctl
            packaging/systemd/mini-singbox.service
            packaging/systemd/mini-singbox-container.service
            packaging/openrc/mini-singbox
            packaging/external/mini-singbox-run
          )
          duplicate_names="$(printf '%s\n' "${release_files[@]}" | sed 's|.*/||' | sort | uniq -d)"
          test -z "$duplicate_names"
          : > dist/SHA256SUMS
          for release_file in "${release_files[@]}"; do
            release_sha256="$(sha256sum "$release_file" | awk '{ print $1 }')"
            release_name="${release_file##*/}"
            printf '%s  %s\n' "$release_sha256" "$release_file" >> dist/SHA256SUMS
            if [ "$release_name" != "$release_file" ]; then
              printf '%s  %s\n' "$release_sha256" "$release_name" >> dist/SHA256SUMS
            fi
          done
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm dist/SHA256SUMS -s "$RUNNER_TEMP/minisign.key" -x dist/SHA256SUMS.minisig
          unset MINISIGN_PASSWORD
          minisign -Vm dist/SHA256SUMS -x dist/SHA256SUMS.minisig -p release/minisign.pub >/dev/null
      - name: Stage flat GitHub Release assets
        run: |
          set -eu
          upload_dir="$RUNNER_TEMP/release-upload"
          rm -rf -- "$upload_dir"
          mkdir -p -- "$upload_dir"
          files=(
            dist/mini-singbox-linux-amd64
            dist/mini-singbox-linux-arm64
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/SBOM.spdx.json
            dist/provenance.intoto.jsonl
            dist/go-version-amd64.txt
            dist/go-version-arm64.txt
            dist/compiled-deps-linux-amd64.txt
            dist/upstream-compiled-network-utilities.txt
            dist/release-metadata.txt
            dist/oci-digests.txt
            LICENSE
            NOTICE
            README.md
            bootstrap.sh
            CHANGELOG.md
            SECURITY.md
            MIGRATION.md
            docs/release.md
            docs/alpine-container.md
            docs/nat-vps.md
            docs/tcp-tuning.md
            docs/v1.0.0-readiness.md
            docs/validation.md
            examples/config.json
            release/minisign.pub
            scripts/deploy.sh
            scripts/uninstall.sh
            scripts/mini-singboxctl
            scripts/mini-singbox-containerctl
            packaging/systemd/mini-singbox.service
            packaging/systemd/mini-singbox-container.service
            packaging/openrc/mini-singbox
            packaging/external/mini-singbox-run
          )
          duplicate_names="$(printf '%s\n' "${files[@]}" | sed 's|.*/||' | sort | uniq -d)"
          test -z "$duplicate_names"
          for file in "${files[@]}"; do
            cp -- "$file" "$upload_dir/${file##*/}"
          done
          test "$(find "$upload_dir" -maxdepth 1 -type f | wc -l)" -eq "${#files[@]}"
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ env.RELEASE_TAG }}
          path: |
            dist/compiled-deps-linux-amd64.txt
            dist/upstream-compiled-network-utilities.txt
            dist/go-version-amd64.txt
            dist/go-version-arm64.txt
            dist/nm-amd64.txt
      - name: Preserve signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/release-upload/*
      - name: Select GitHub Release publication mode
        id: publication
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -n "$RELEASE_GITHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Signed flat Release bundle preserved; automated publication is disabled because RELEASE_GITHUB_TOKEN is not configured."
          {
            echo "### Signed Release bundle ready"
            echo
            echo "The repository policy rejects formal publication by the default GitHub Actions token."
            echo "Download \`release-bundle-$RELEASE_TAG\`, create a draft for the existing annotated tag,"
            echo "upload every flat asset, verify the asset count, and publish the draft."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        if: steps.publication.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          files=("$RUNNER_TEMP"/release-upload/*)
          args=(
            release create "$RELEASE_TAG"
            "${files[@]}"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --target "$RELEASE_COMMIT"
            --title "mini-singbox $RELEASE_TAG"
            --notes-file "$RUNNER_TEMP/release-upload/CHANGELOG.md"
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
