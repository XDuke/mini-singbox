version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    allow:
      - dependency-name: github.com/sagernet/sing-box
    commit-message:
      prefix: deps
      include: scope
